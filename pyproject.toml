[project]
name = "syn"
dynamic = ["version"]
license = "Apache-2.0"
readme = "README.md"
description = "Token-lean command line toolbox for Salesforce metadata repos"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
syn = "syn.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "syn.__version__" }

[tool.setuptools]
packages = ["syn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
